<script>
// Toggle navbar auth links and insert into main nav list for mobile/menu
(function(){
	fetch('auth_status.php').then(r=>r.json()).then(js=>{
		const navRight = document.querySelector('.pl-nav-right');
		const navList = document.querySelector('.pl-nav-menu ul');
		if(!navRight) return;
		const enroll = navRight.querySelector('.pl-nav-cta');
		if(js.logged_in){
			const userLink = document.createElement('a');
			userLink.className = 'pl-nav-link';
			userLink.href = '#';
			userLink.textContent = 'Hi, ' + (js.user.full_name || js.user.username || js.user.email);
			enroll.insertAdjacentElement('beforebegin', userLink);
			if(navList){
				const li = document.createElement('li');
				li.innerHTML = '<a class="pl-nav-link" href="logout.php">Logout</a>';
				navList.appendChild(li);
			}
		} else {
			const loginLi = document.createElement('li'); loginLi.innerHTML = '<a class="pl-nav-link" href="login.php">Login</a>';
			const regLi = document.createElement('li'); regLi.innerHTML = '<a class="pl-nav-link" href="register.php">Register</a>';
			if(navList){ navList.appendChild(loginLi); navList.appendChild(regLi); }
			const login = document.createElement('a'); login.className='pl-nav-link'; login.href='login.php'; login.textContent='Login';
			const reg = document.createElement('a'); reg.className='pl-nav-link'; reg.href='register.php'; reg.textContent='Register';
			enroll.insertAdjacentElement('beforebegin', reg);
			reg.insertAdjacentElement('beforebegin', login);
		}
	}).catch(()=>{});
})();
</script>
